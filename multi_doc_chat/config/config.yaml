embedding_model:
  provider: "google"
  model_name: "models/gemini-embedding-001"

retriever:
  mode: "hybrid"  # options: "hybrid", "dense"
  fallback_to_dense: true
  top_k: 5
  dense_k: 10
  sparse_k: 10
  rrf_k: 60
  search_type: "mmr"
  fetch_k: 20
  lambda_mult: 0.5

llm:
  groq:
    provider: "groq"
    model_name: "openai/gpt-oss-20b"
    temperature: 0
    max_output_tokens: 2048

  google:
    provider: "google"
    model_name: "gemini-3.6-flash"
    temperature: 0
    max_output_tokens: 2048
