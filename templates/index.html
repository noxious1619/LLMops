<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/static/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MultiDocChat | AI Document Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            color: #9ca3af;
            margin-top: 5px;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .upload-card,
        .chat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-size: 19px;
            margin-bottom: 15px;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        }

        input[type="file"] {
            margin: 15px 0;
            max-width: 100%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 14px;
            color: #64748b;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .session-info {
            margin-top: 12px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 7px;
            font-size: 12px;
            word-break: break-all;
            display: none;
        }

        .chat-box {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .assistant {
            background: #e5e7eb;
            margin-right: auto;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            min-width: 0;
        }

        .chat-input input:focus {
            border-color: #2563eb;
        }

        @media (max-width: 600px) {
            .chat-input {
                flex-direction: column;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>MultiDocChat</h1>
        <p>AI-powered multi-document question answering</p>
    </header>

    <main class="container">

        <!-- Document Upload -->
        <section class="upload-card">

            <h2>Upload Documents</h2>

            <div class="upload-area">

                <p>Select documents to build your knowledge base.</p>

                <input type="file" id="files" multiple accept=".pdf,.docx,.txt">

                <br>

                <button id="uploadBtn" onclick="uploadFiles()">
                    Upload & Process
                </button>

                <p class="status" id="uploadStatus">
                    No documents uploaded yet.
                </p>

                <div class="session-info" id="sessionInfo">
                    Session ID: <span id="sessionId"></span>
                </div>

            </div>

        </section>

        <!-- Chat Interface -->
        <section class="chat-card">

            <h2>Chat with Your Documents</h2>

            <div class="chat-box" id="chatBox">

                <p class="status">
                    Upload documents first to start chatting.
                </p>

            </div>

            <div class="chat-input">

                <input type="text" id="message" placeholder="Ask something about your documents..." disabled>

                <button id="sendBtn" onclick="sendMessage()" disabled>
                    Send
                </button>

            </div>

        </section>

    </main>

    <script>

        // Same-origin API connection to FastAPI
        const API_URL = "";

        let sessionId = null;

        const fileInput = document.getElementById("files");
        const uploadBtn = document.getElementById("uploadBtn");
        const uploadStatus = document.getElementById("uploadStatus");

        const messageInput = document.getElementById("message");
        const sendBtn = document.getElementById("sendBtn");

        const chatBox = document.getElementById("chatBox");

        // --------------------------------
        // Upload Documents
        // --------------------------------

        async function uploadFiles() {

            if (!fileInput.files.length) {
                showStatus("Please select at least one file.", "error");
                return;
            }

            const formData = new FormData();

            for (const file of fileInput.files) {
                formData.append("files", file);
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = "Processing...";

            showStatus("Uploading and processing documents...", "");

            try {

                const response = await fetch(`${API_URL}/upload`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Document upload failed");
                }

                // Save session ID returned by FastAPI
                sessionId = data.session_id;

                showStatus(
                    "Documents indexed successfully!",
                    "success"
                );

                // Display session ID
                document.getElementById("sessionId").textContent = sessionId;

                document.getElementById("sessionInfo").style.display = "block";

                // Enable chat
                messageInput.disabled = false;
                sendBtn.disabled = false;

                // Clear previous conversation
                chatBox.innerHTML = "";

                addMessage(
                    "assistant",
                    "Your documents are ready! Ask me anything about them."
                );

            } catch (error) {

                showStatus(error.message, "error");

            } finally {

                uploadBtn.disabled = false;
                uploadBtn.textContent = "Upload & Process";

            }
        }

        // --------------------------------
        // Send Chat Message
        // --------------------------------

        async function sendMessage() {

            const message = messageInput.value.trim();

            if (!message || !sessionId) {
                return;
            }

            // Display user message
            addMessage("user", message);

            messageInput.value = "";

            sendBtn.disabled = true;
            messageInput.disabled = true;

            try {

                const response = await fetch(`${API_URL}/chat`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        session_id: sessionId,
                        message: message
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Chat request failed");
                }

                // Display AI response
                addMessage("assistant", data.answer);

            } catch (error) {

                addMessage(
                    "assistant",
                    "Error: " + error.message
                );

            } finally {

                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();

            }
        }

        // --------------------------------
        // Display Messages
        // --------------------------------

        function addMessage(role, content) {

            const messageElement = document.createElement("div");

            messageElement.className = `message ${role}`;

            // textContent prevents HTML injection
            messageElement.textContent = content;

            chatBox.appendChild(messageElement);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --------------------------------
        // Upload Status
        // --------------------------------

        function showStatus(message, type) {

            uploadStatus.textContent = message;

            uploadStatus.className = "status";

            if (type) {
                uploadStatus.classList.add(type);
            }
        }

        // --------------------------------
        // Enter Key Support
        // --------------------------------

        messageInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter" && !sendBtn.disabled) {
                sendMessage();
            }

        });

    </script>

</body>

</html>
